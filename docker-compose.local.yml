services:
  postgres:
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    image: postgres:16.4
    networks:
      - project
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - '5432:5432' # Expose for local access

  web:
    restart: always
    environment:
      # Bot Configuration
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_MODE=polling # Use polling for local testing
      - BOT_ADMINS=${BOT_ADMINS}
      - BOT_ALLOWED_UPDATES=${BOT_ALLOWED_UPDATES}

      # Server Configuration
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000

      # Database
      - DATABASE_URL=postgresql://postgres@postgres:5432/postgres

      # Wallet Configuration (for pooled trading fund)
      - WALLET_MASTER_SEED=${WALLET_MASTER_SEED}
      - WALLET_ENCRYPTION_KEY=${WALLET_ENCRYPTION_KEY}

      # Solana Configuration (devnet for testing)
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}

      # Logging (verbose for local testing)
      - DEBUG=true
      - LOG_LEVEL=debug
    build: ./
    command: [./start.sh]
    ports:
      - '3000:3000' # Expose for local access
    depends_on:
      - postgres
    networks:
      - project

networks:
  project:

volumes:
  postgres_data_local:
